<div class="sign-in-card">
    <div class="title">
        <label>Sign In to Construction Tracker By Hassan Allam</label>
    </div>
    <div class="sign-in-body">
        <!-- LEFT: Hassan Allam Holding Icon -->
        <div class="image-panel">
            <img src="/HassanAllamHoldingIcon.webp" alt="Sign In Image">
        </div>

        <!-- RIGHT: Sign-in form -->
        <form class="entries" #SubmitForm="ngForm" (ngSubmit)="VerifyUser(usernameOrEmail, password)">
            <div class="username-entry">
                <label>username or email</label><br>
                <input type="text" placeholder="..." [(ngModel)]="usernameOrEmail" name="usernameOrEmail">
            </div>
            <div class="password-entry">
                <label>password</label><br>
                <input type="password" placeholder="..." [(ngModel)]="password" name="password">
            </div>

            @if (IsError()) {
                <p class="error-message">{{ errorMessage() }}</p>
            }

            <button class="log-in-button" type="submit">Sign In</button>

            <a class="sign-up-link" (click)="SendToSignUp()">Don't have an account? Sign Up Now</a>
        </form>
    </div>
</div>
