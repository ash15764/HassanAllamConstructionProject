<nav class="navbar">
    <div class="nav-brand">Construction Tracker</div>
    <ul class="nav-links">
        <li [class.active]="activeTab() === 'home'" (click)="goToHome()" routerLink="/home">Home</li>
        <li [class.active]="activeTab() === 'projects'" (click)="goToProjects()">Projects</li>
        <li class="disabled-tab" (click)="showComingSoon('Statistics')">Statistics</li>
        <li class="disabled-tab" (click)="showComingSoon('News')">News</li>
        <li class="disabled-tab" (click)="showComingSoon('Communicate')">Communicate</li>
    </ul>
    <div class="nav-user">
        <span>{{ userService.currentUser()?.username }}</span>
        <span class="role-badge">{{ userService.currentUser()?.role }}</span>
        <button (click)="Logout()">Logout</button>
    </div>
</nav>

<router-outlet></router-outlet>

@if (comingSoonLabel()) {
    <div class="toast">{{ comingSoonLabel() }} coming soon</div>
}
